<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Отметка сна</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            background: #f5f5f5; padding: 20px;
        }
        h2 { color: #333; margin-bottom: 30px; font-weight: 500; }
        .btn {
            width: 100%; max-width: 300px;
            padding: 28px; margin: 12px 0;
            font-size: 24px; font-weight: 500;
            border: none; border-radius: 16px;
            color: white; cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #wake  { background: #2ecc71; }
        #sleep { background: #e74c3c; }
        #status {
            margin-top: 30px; padding: 12px 20px;
            border-radius: 8px; font-size: 14px;
            color: #555; background: white;
            min-height: 20px; text-align: center;
            max-width: 300px; width: 100%;
        }
    </style>
</head>
<body>
    <h2>Отметка времени</h2>
    <button class="btn" id="wake">☀️ Подъём</button>
    <button class="btn" id="sleep">🌙 Отбой</button>
    <div id="status"></div>

<script>
    // Для шага 1 (заглушки) — тот же ключ, что в api/index.php.
    // На шаге 2 перенесём в безопасное место или оставим здесь (страница приватная, ключ в исходнике — компромисс).
    const API_KEY = 'test-key-12345';
    const API_BASE = 'api/events/';

    function setStatus(text, isError = false) {
        const el = document.getElementById('status');
        el.textContent = text;
        el.className = isError ? 'err' : 'ok';
    }

    async function send(type) {
        const btns = document.querySelectorAll('.btn');
        btns.forEach(b => b.disabled = true);
        setStatus('Отправка...');

        const now = new Date().toISOString();

        try {
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': API_KEY,
                },
                body: JSON.stringify({
                    event_type: type,
                    event_time: now,
                }),
            });

            const data = await res.json();

            if (res.ok) {
                const local = new Date(now).toLocaleTimeString('ru-RU', {
                    hour: '2-digit', minute: '2-digit'
                });
                setStatus(`✓ ${type === 'wake' ? 'Подъём' : 'Отбой'}: ${local}`);
            } else {
                setStatus(`Ошибка: ${data.error || res.status}`, true);
            }
        } catch (e) {
            setStatus(`Сеть: ${e.message}`, true);
        } finally {
            btns.forEach(b => b.disabled = false);
        }
    }

    document.getElementById('wake').addEventListener('click', () => send('wake'));
    document.getElementById('sleep').addEventListener('click', () => send('sleep'));
</script>
</body>
</html>
